# golangci-lint v2.14.0 (pinned; CI installs the same version)
version: "2"

run:
  timeout: 10m
  build-tags:
    - integration
    - acceptance
    - bench

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - gocritic
    - errorlint
    - wrapcheck
    - bodyclose
    - noctx
    - contextcheck
    - containedctx
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - nilnil
    - exhaustive
    - forcetypeassert
    - misspell
    - unparam
    - unconvert
    - prealloc
    - predeclared
    - funlen
    - gocyclo
    - gocognit
    - nestif
    - lll
    - godot
    - dupl
    - goconst
    - depguard
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usestdlibvars
    - perfsprint
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    funlen:
      lines: -1
      statements: 60
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    lll:
      line-length: 120
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 4
      # SQL named arguments and column names read better inline.
      ignore-string-values:
        - "^(now|queue|id|kind|limit|cid|keys)$"
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: unexported-return
          disabled: true
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/thnhdatle/foreman/internal/domain
            # The cron parser is a pure library used by domain/schedule.
            - github.com/robfig/cron/v3
            - github.com/stretchr/testify
            - pgregory.net/rapid
            - github.com/google/go-cmp
        app:
          files:
            - "**/internal/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/thnhdatle/foreman/internal/domain
            - github.com/thnhdatle/foreman/internal/platform
            - github.com/thnhdatle/foreman/internal/testutil
            - github.com/stretchr/testify
            - pgregory.net/rapid
            - github.com/google/go-cmp
            - go.uber.org/goleak
  exclusions:
    generated: lax
    rules:
      # wrapcheck applies to adapters only.
      - path-except: internal/adapter/
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - contextcheck
          - perfsprint
          - prealloc
          - unparam
          - wrapcheck
          - funlen
          - dupl
          - goconst
          - gocognit
          - gocyclo
          - gosec
          - forcetypeassert
          - lll
          - maintidx
      # Acceptance criteria share one compose stack and run one at a time.
      - path: acceptance/
        linters:
          - gocyclo
          - nestif
          - paralleltest
      - path: (_test\.go|^examples/)
        text: "shadow: declaration of \"err\""
        linters:
          - govet
      - path: testdata/
        linters:
          - all

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thnhdatle/foreman
  exclusions:
    paths:
      - testdata/
