name: Bug report
description: Report a defect in Foreman or the foreman CLI.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, follow
        SECURITY.md instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Foreman version (module or `foreman version`), plus Go and Postgres versions.
      placeholder: "foreman v0.1.0, go1.27.0, postgres 16.4"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant client and worker configuration. Remove secrets.
      render: yaml
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps or code that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets.
      render: text
