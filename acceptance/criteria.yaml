project: foreman
machine: "MacBook Pro M3 Pro 36 GB, Docker VM 8 CPU / 20 GB"
# Each criterion has thresholds for the reference machine (pass.mac) and for CI
# runners (pass.ci, selected with CI=1). Tests read them at run time.
# kind: functional (correctness under failures), performance (calibrated for the
# reference machine) or release (quickstart from a clean checkout).
criteria:
  - id: FMN-01
    title: "No lost jobs with random kill -9 of workers and the leader"
    test: TestAcceptance_FMN01_NoLostJobs
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        jobs: 1000000
        client_processes: 4
        workers_per_client: 50
        kill_interval_min_s: 20
        kill_interval_max_s: 60
        heartbeat_interval_s: 2
        rescue_stuck_jobs_after_s: 10
        finalized_ratio_min: 1.0
        lost_max: 0
        unexplained_duplicate_executions_max: 0
      ci:
        jobs: 100000
        client_processes: 4
        workers_per_client: 50
        kill_interval_min_s: 20
        kill_interval_max_s: 60
        heartbeat_interval_s: 2
        rescue_stuck_jobs_after_s: 10
        finalized_ratio_min: 1.0
        lost_max: 0
        unexplained_duplicate_executions_max: 0

  - id: FMN-02
    title: "Periodic jobs enqueued exactly once per tick across leader crashes"
    test: TestAcceptance_FMN02_PeriodicExactlyOnce
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: &fmn02
        simulated_hours: 24
        real_minutes_max: 5
        clients: 3
        crash_every_simulated_min: 10
        catch_up_min: 5
        duplicate_ticks_max: 0
        missed_ticks_max: 0
      ci: *fmn02

  - id: FMN-03
    title: "Transactional enqueue: rolled-back transactions leave no jobs"
    test: TestAcceptance_FMN03_TransactionalInsert
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: &fmn03
        transactions: 10000
        rolled_back_ratio: 0.5
        jobs_from_rolled_back_max: 0
        committed_jobs_ratio_min: 1.0
      ci: *fmn03

  - id: FMN-04
    title: "Throughput of no-op jobs with 4 clients x 50 workers"
    test: BenchmarkAcceptance_FMN04_Throughput
    kind: performance
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        prefill_jobs: 1000000
        clients: 4
        workers_per_client: 50
        duration_s: 300
        throughput_min_jobs_per_s: 5000
        fair_keys: 1000
        fair_per_key_limit: 50
      ci:
        prefill_jobs: 1000000
        clients: 4
        workers_per_client: 50
        duration_s: 300
        throughput_min_jobs_per_s: 1500
        fair_keys: 1000
        fair_per_key_limit: 50

  - id: FMN-05
    title: "Pickup latency at a steady 1,000 inserts/s"
    test: BenchmarkAcceptance_FMN05_PickupLatency
    kind: performance
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        insert_rate_per_s: 1000
        duration_s: 120
        warmup_s: 10
        clients: 4
        workers_per_client: 50
        p99_ms_max: 100
      ci:
        insert_rate_per_s: 1000
        duration_s: 120
        warmup_s: 10
        clients: 4
        workers_per_client: 50
        p99_ms_max: 300

  - id: FMN-06
    title: "Fairness under overload keeps a small tenant's wait low"
    test: TestAcceptance_FMN06_Fairness
    kind: performance
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        job_ms: 50
        clients: 4
        workers_per_client: 50
        backlog_capacity_seconds: 60
        duration_s: 120
        a_rate_factor: 0.8
        b_rate_factor: 0.04
        fair_vs_alone_factor_max: 2.0
        fair_floor_ms: 100
        fair_vs_unfair_factor_max: 0.2
      ci:
        job_ms: 50
        clients: 4
        workers_per_client: 10
        backlog_capacity_seconds: 60
        duration_s: 120
        a_rate_factor: 0.8
        b_rate_factor: 0.04
        fair_vs_alone_factor_max: 2.0
        fair_floor_ms: 100
        fair_vs_unfair_factor_max: 0.2

  - id: FMN-07
    title: "Per-key concurrency limit is never exceeded across clients"
    test: TestAcceptance_FMN07_PerKeyLimit
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        jobs: 100000
        keys: 1000
        clients: 4
        workers_per_client: 50
        per_key_limit: 5
        sample_interval_ms: 10
        violations_max: 0
      ci:
        jobs: 20000
        keys: 1000
        clients: 4
        workers_per_client: 50
        per_key_limit: 5
        sample_interval_ms: 10
        violations_max: 0

  - id: FMN-08
    title: "Unique jobs: concurrent inserts from Go and SQL yield one job per key"
    test: TestAcceptance_FMN08_Unique
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: &fmn08
        inserts: 10000
        unique_keys: 100
        goroutines: 50
        processes: 2
        sql_function_ratio: 0.5
        jobs_exact: 100
      ci: *fmn08

  - id: FMN-09
    title: "A frozen worker's job is rescued and its stale completion rejected"
    test: TestAcceptance_FMN09_Rescue
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: &fmn09
        rescue_stuck_jobs_after_s: 10
        heartbeat_interval_s: 2
        rescue_within_heartbeats: 2
        completed_by_other_client: true
        stale_completion_rejected: true
      ci: *fmn09

  - id: FMN-10
    title: "Clients recover from a 30 s database connection loss without losing results"
    test: TestAcceptance_FMN10_ConnectionLoss
    kind: functional
    real_deps: [postgres, toxiproxy]
    requires: [docker]
    pass:
      mac: &fmn10
        outage_s: 30
        rescue_stuck_jobs_after_s: 120
        clients: 2
        load_jobs_per_s: 200
        load_before_s: 20
        load_after_s: 20
        lost_max: 0
        completion_mismatch_max: 0
      ci: *fmn10

  - id: FMN-11
    title: "Cancelling running jobs cancels their context within 1 s"
    test: TestAcceptance_FMN11_Cancel
    kind: functional
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac: &fmn11
        jobs: 1000
        clients: 2
        cancel_latency_p99_ms_max: 1000
        cancelled_ratio_min: 1.0
      ci: *fmn11

  - id: FMN-12
    title: "Soak: table size and latency stay stable with retention and reindexing"
    test: TestAcceptance_FMN12_Soak
    kind: performance
    real_deps: [postgres]
    requires: [docker]
    pass:
      mac:
        duration_s: 3600
        rate_per_s: 1000
        completed_retention_s: 300
        cleaner_interval_s: 1
        reindex_interval_s: 600
        size_drift_max: 0.2
        p99_drift_max: 0.5
      ci:
        duration_s: 600
        rate_per_s: 1000
        completed_retention_s: 300
        cleaner_interval_s: 1
        reindex_interval_s: 600
        size_drift_max: 0.2
        p99_drift_max: 0.5

  - id: FMN-13
    title: "Quickstart: README starts Postgres, runs examples/basic, job completes"
    test: TestAcceptance_FMN13_Quickstart
    kind: release
    real_deps: [docker]
    requires: [docker]
    pass:
      mac: &fmn13
        duration_max_s: 300
        success: true
      ci: *fmn13
